name: tanstack-start
type: service
from: node
fromVersionConstraint: "^2.0.0"
fromVersion: "2.2.0"
guidance: GUIDANCE.md
title: Node.js (TanStack Start)
labels:
- tanstack-start
- node

env:
- name: WORKSPACE_NODE_COMMAND
  value: workspace-node vite-start
- name: NODE_ENV
  value: production
  envType: dev

build:
  dockerfile: Dockerfile
  # Unlike the default build context, .gitignore stays in: Tailwind CSS reads it
  # to skip the build output, or the server and client builds generate
  # different stylesheets and pages link a file that does not exist.
  dockerignoreContent: |
    .git
    .wodby-ci-cache
    .output
    .nitro
    .tanstack
  connect: true
  boilerplates:
  - name: tanstack-start
    title: TanStack Start Boilerplate
    repo: https://github.com/wodby/tanstack-start-boilerplate
    branch: main

workspace:
  reload: watch
  # Build output of the Nitro server and TanStack's generated caches.
  ignore: ['/.output/', '/.nitro/', '/.tanstack/']
